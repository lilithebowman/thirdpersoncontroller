name: Snyk Security Scan

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  snyk:
    name: Scan source and dependencies
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found; skipping dependency installation."
          fi

      - name: Install Snyk CLI
        uses: snyk/actions/setup@b075801f26076be9bb50521154cafab73f44da0c
        with:
          snyk-version: latest

      - name: Scan source code with Snyk Code
        id: snyk-code
        continue-on-error: true
        run: snyk code test --sarif-file-output=snyk-code.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Scan npm dependencies with Snyk Open Source
        id: snyk-open-source
        continue-on-error: true
        run: |
          if [ -f package.json ]; then
            snyk test --file=package.json --package-manager=npm --sarif-file-output=snyk-open-source.sarif
          else
            echo "No package.json found; skipping Open Source scan."
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk Code results
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Upload Snyk Open Source results
        if: always() && hashFiles('snyk-open-source.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-open-source.sarif
          category: snyk-open-source

      - name: Fail if either Snyk scan failed
        if: steps.snyk-code.outcome == 'failure' || steps.snyk-open-source.outcome == 'failure'
        run: exit 1
